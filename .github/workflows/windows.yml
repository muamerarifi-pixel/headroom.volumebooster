# Builds and tests the Windows installer on pull requests. Releases are
# published by package.yml, which attaches Headroom-Setup.exe to the latest release.

name: Windows app

on:
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 nsis

      - name: Build and test
        run: ./windows/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Headroom-Setup
          path: windows/dist/Headroom-Setup.exe
