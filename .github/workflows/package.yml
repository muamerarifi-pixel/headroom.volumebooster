# Checks the extension, builds the Windows installer, and publishes both on the
# Releases page. Direct downloads:
#   https://github.com/muamerarifi-pixel/headroom.volumebooster/releases/latest/download/headroom.zip
#   https://github.com/muamerarifi-pixel/headroom.volumebooster/releases/latest/download/Headroom-Setup.exe

name: Package extension and Windows app

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest and scripts
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          for f in *.js; do node --check "$f"; done

      - name: Build zips
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist/headroom
          cp -r manifest.json *.js *.html *.css icons dist/headroom/
          (cd dist && zip -qr -X headroom.zip headroom)
          (cd dist/headroom && zip -qr -X ../headroom-store-upload.zip .)

      - name: Build Windows installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 nsis
          ./windows/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          ASSETS="dist/headroom.zip dist/headroom-store-upload.zip windows/dist/Headroom-Setup.exe"
          NOTES="**Windows app (boosts every sound on your PC):** download **Headroom-Setup.exe** and run it. If SmartScreen warns you, click More info → Run anyway. When the audio engine asks which devices to use, tick your speakers and headphones.

          **Chrome extension (boosts browser tabs):** download **headroom.zip**, unzip it, then in chrome://extensions turn on Developer mode → Load unpacked → pick the headroom folder. (headroom-store-upload.zip is for the Chrome Web Store.)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" $ASSETS --title "Headroom $VERSION" --notes "$NOTES" --latest
          fi
