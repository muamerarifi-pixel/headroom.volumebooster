<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Headroom</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="currentColor" opacity="0.08" />
            <rect
              x="1.5"
              y="1.5"
              width="29"
              height="29"
              rx="8"
              fill="none"
              stroke="currentColor"
              stroke-opacity="0.22"
            />
            <path d="M7 11h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path
              d="M7 22c2.2-0.6 3.1-7.4 5.1-7.4S15.2 21 17 21s2.8-8.6 4.8-8.6 2.6 6.2 4.2 3.4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <div>
            <h1>Headroom</h1>
            <p class="tag">
              Limiter-protected volume
              <span id="live" class="live" hidden>Live</span>
            </p>
          </div>
        </div>
        <label class="switch-wrap">
          <span id="enabled-label" class="micro">On</span>
          <input id="enabled" type="checkbox" checked />
          <span class="switch" aria-hidden="true"></span>
        </label>
      </header>

      <section class="panel">
        <div class="row-between">
          <h2>This tab</h2>
          <span id="mode" class="mode" data-tone="idle">Auto</span>
        </div>
        <p id="tab-label" class="tab-label">…</p>
        <p id="status" class="status" data-tone="idle">Checking this tab…</p>
        <div class="site-bar">
          <label class="switch-wrap site-toggle">
            <input id="site" type="checkbox" checked />
            <span class="switch" aria-hidden="true"></span>
            <span class="site-text">Boost <b id="site-host">this site</b></span>
          </label>
          <button
            id="pin"
            class="pin-btn"
            type="button"
            title="Save a separate boost & limiter profile for this website"
          >
            Pin site
          </button>
        </div>
        <div class="capture-row">
          <button id="capture" class="secondary" type="button">Deep capture</button>
          <button id="stop" class="secondary stop-btn" type="button" hidden>Stop capture</button>
          <span class="hint-inline">Fallback for DRM, Spotify, Netflix &amp; calls</span>
        </div>
        <button id="error" class="error" type="button" title="Click to dismiss" hidden></button>
      </section>

      <section class="panel boost">
        <div class="boost-readout">
          <div class="readout-main">
            <span id="boost-db" class="db">+8.0</span>
            <span id="boost-unit" class="unit">dB</span>
          </div>
          <div class="readout-meta">
            <span id="profile-badge" class="profile-badge">Global</span>
            <span id="boost-pct" class="pct">251%</span>
          </div>
        </div>
        <input id="boost" class="fader" type="range" min="0" max="24" step="0.5" value="8" />
        <div class="fader-legend">
          <span id="fader-min">0</span>
          <span id="fader-mid">+12</span>
          <span id="fader-max">+24</span>
        </div>
        <div class="pills">
          <button id="auto-level" type="button" title="Continuously ride gain to a steady loudness">
            Auto-Level
          </button>
          <button id="voice" type="button" title="Cut rumble below 90 Hz and clarify speech">
            Voice
          </button>
          <button type="button" data-boost="0">Unity</button>
          <button type="button" data-boost="8">+8</button>
          <button type="button" data-boost="16">+16</button>
          <button id="bypass" type="button" title="Temporary dry/wet A/B comparison">A/B</button>
        </div>
        <div class="meters">
          <div class="meter-row">
            <span>IN</span>
            <div class="bar">
              <i id="in-fill"></i>
              <b id="in-hold"></b>
            </div>
            <em id="in-read">–∞</em>
          </div>
          <div class="meter-row">
            <span>OUT</span>
            <div class="bar">
              <i id="out-fill"></i>
              <b id="out-hold"></b>
            </div>
            <em id="out-read">–∞</em>
          </div>
          <div class="meter-row">
            <span>GR</span>
            <div class="bar">
              <i id="gr-fill" class="warn"></i>
            </div>
            <em id="gr-read">0.0</em>
          </div>
          <div class="clip-row">
            <span class="lr">
              <i id="l-fill"></i>
              <i id="r-fill"></i>
            </span>
            <span id="clip" class="clip">Clip</span>
          </div>
        </div>
      </section>

      <section class="panel controls-panel">
        <div class="inline-row">
          <h2>Apply to</h2>
          <div class="segmented">
            <button type="button" data-scope="all">All tabs</button>
            <button type="button" data-scope="active">Active tab</button>
          </div>
        </div>
        <div class="divider"></div>
        <div class="limiter-block">
          <div class="row-between">
            <h2>Limiter</h2>
            <span id="style-hint" class="style-hint">Light compression into the limiter.</span>
          </div>
          <div id="styles" class="segmented segmented-3">
            <button type="button" data-style="transparent">Transparent</button>
            <button type="button" data-style="balanced" class="active">Balanced</button>
            <button type="button" data-style="night">Night</button>
          </div>
        </div>
      </section>

      <footer>
        <kbd>Alt+Shift+H</kbd> on/off &middot; <kbd>Alt+Shift+B</kbd> capture &middot; Audio stays local.
      </footer>
    </div>
    <script src="dsp.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
